<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roman Rise/Fall 15S</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07101c;color:#eef6ff;font-family:system-ui}.w{max-width:900px;margin:auto;padding:12px}.c{background:#101c2b;border:1px solid #29415e;border-radius:18px;padding:15px;margin:12px 0}.r{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}input,select,button{width:100%;padding:11px;border-radius:11px;border:1px solid #29415e;background:#07111e;color:white}button{margin-top:9px;background:#1678e8;font-weight:800}.stop{background:#92243a}.s{background:#08121f;padding:9px;border-radius:11px}.k,label{font-size:11px;color:#92a9c0}.v{font-weight:800;font-size:17px}.f{font:700 12px monospace;color:#8ec8ff}table{width:100%;font-size:11px;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #26394e;text-align:left}@media(max-width:650px){.r{grid-template-columns:1fr}.g{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="w">
<div class="c"><h1>⚡ Roman Rise/Fall 15S</h1><div class="f">TREND → PULLBACK → 3-TICK CONFIRM → RISE/FALL</div></div>
<div class="c"><h2>Deriv</h2><div class="r"><div><label>App ID</label><input id="app"></div><div><label>API Token</label><input id="tok" type="password"></div><div><label>Account</label><select id="acct"><option value="demo">DEMO</option><option value="real">REAL</option></select></div></div><button id="connect">CONNECT</button><p id="status">Ready</p></div>
<div class="c"><h2>Trade</h2><div class="r"><div><label>Duration seconds</label><input id="dur" type="number" value="15"></div><div><label>Confirm %</label><input id="min" type="number" value="72"></div><div><label>Loss action</label><select id="action"><option value="switch1">Switch after 1 loss</option><option value="switch2" selected>Switch after 2 losses</option><option value="stop1">Stop on single loss</option><option value="cycle">Cycle</option></select></div><div><label>Initial stake</label><input id="base" type="number" value="1" step=".01"></div><div><label>Martingale</label><input id="mult" type="number" value="2" step=".01"></div><div><label>Max stake</label><input id="max" type="number" value="400"></div><div><label>TP</label><input id="tp" type="number" value="20"></div><div><label>SL</label><input id="sl" type="number" value="400"></div><div><label>Max losses</label><input id="maxl" type="number" value="8"></div></div><div class="f">LOSS→S×M · WIN→S₀</div><button id="start">START</button><button id="stop" class="stop">STOP</button></div>
<div class="c"><div class="g"><div class="s"><div class="k">Balance</div><div id="bal" class="v">—</div></div><div class="s"><div class="k">Market</div><div id="market" class="v">—</div></div><div class="s"><div class="k">Signal</div><div id="sig" class="v">WAIT</div></div><div class="s"><div class="k">Score</div><div id="score" class="v">0%</div></div><div class="s"><div class="k">Stake</div><div id="stake" class="v">$1.00</div></div><div class="s"><div class="k">W/L</div><div id="wl" class="v">0/0</div></div><div class="s"><div class="k">Loss streak</div><div id="ls" class="v">0</div></div><div class="s"><div class="k">P/L</div><div id="pl" class="v">$0.00</div></div></div></div>
<div class="c"><h2>Scanner</h2><table><thead><tr><th>Market</th><th>Signal</th><th>Score</th></tr></thead><tbody id="scan"></tbody></table></div></div>
<script>
const $=x=>document.getElementById(x),API="https://api.derivws.com",PUB="wss://api.derivws.com/trading/v1/options/ws/public",S={mw:null,tw:null,cur:"USD",on:false,busy:false,r:0,t:1000,sy:new Map,ticks:new Map,ok:new Set,stake:1,pl:0,w:0,l:0,ls:0,ml:new Map,blocked:new Set,active:null,pending:null};
const money=n=>"$"+Number(n||0).toFixed(2),say=x=>$("status").textContent=x,ms=o=>S.mw?.readyState===1&&S.mw.send(JSON.stringify(o)),ts=o=>S.tw?.readyState===1&&S.tw.send(JSON.stringify(o));
async function api(p,m="GET"){let r=await fetch(API+p,{method:m,headers:{Authorization:"Bearer "+$("tok").value.trim(),"Deriv-App-ID":$("app").value.trim(),Accept:"application/json","Content-Type":"application/json"}}),j=await r.json();if(!r.ok||j.errors?.length)throw Error(j.errors?.[0]?.message||j.message||"API error");return j}
async function connect(){try{say("Connecting…");S.mw=new WebSocket(PUB);await new Promise((a,b)=>{S.mw.onopen=a;S.mw.onerror=()=>b(Error("Market connection failed"))});S.mw.onmessage=market;ms({active_symbols:"brief",req_id:++S.r});let a=await api("/trading/v1/options/accounts"),list=Array.isArray(a.data)?a.data:[a.data],ac=list.find(x=>String(x.account_type).toLowerCase()===$("acct").value&&String(x.status||"active").toLowerCase()==="active");if(!ac)throw Error("Account unavailable");S.cur=ac.currency||"USD";let o=await api("/trading/v1/options/accounts/"+encodeURIComponent(ac.account_id)+"/otp","POST"),u=o.data?.url||o.data?.websocket_url||o.data?.websocketUrl||o.data?.ws_url;if(!u)throw Error("OTP URL missing");S.tw=new WebSocket(u);await new Promise((a,b)=>{S.tw.onopen=a;S.tw.onerror=()=>b(Error("Trade connection failed"))});S.tw.onmessage=trade;ts({balance:1,subscribe:1,req_id:++S.t});say("Connected — discovering 15s Rise/Fall markets")}catch(e){say(e.message)}}
function ema(a,n){if(a.length<n)return NaN;let k=2/(n+1),e=a[a.length-n];for(let i=a.length-n+1;i<a.length;i++)e=a[i]*k+e*(1-k);return e}
function calc(a){if(a.length<30)return null;let e8=ema(a,8),e21=ema(a,21),rg=Math.max(...a.slice(-30))-Math.min(...a.slice(-30))||1,tr=(e8-e21)/rg,p=a.slice(-7,-2),up=a.at(-1)>a.at(-2)&&a.at(-2)>=a.at(-3),dn=a.at(-1)<a.at(-2)&&a.at(-2)<=a.at(-3),sg=null;if(tr>0&&Math.min(...p)<=e8&&up)sg="RISE";if(tr<0&&Math.max(...p)>=e8&&dn)sg="FALL";return sg?{sg,n:Math.min(99,Math.round(60+Math.abs(tr)*180))}:null}
function market(e){let d;try{d=JSON.parse(e.data)}catch{return}if(d.msg_type==="active_symbols")for(let x of d.active_symbols||[]){let c=x.underlying_symbol||x.symbol,n=x.underlying_symbol_name||x.display_name||c;if(!c)continue;S.sy.set(c,{c,n});ms({ticks_history:c,count:60,end:"latest",style:"ticks",req_id:++S.r});ms({ticks:c,subscribe:1,req_id:++S.r});ts({proposal:1,amount:1,basis:"stake",contract_type:"CALL",currency:S.cur,underlying_symbol:c,duration:+$("dur").value||15,duration_unit:"s",req_id:++S.t,passthrough:{probe:c}})}if(d.msg_type==="history"){let c=d.echo_req?.ticks_history;if(c)S.ticks.set(c,(d.history?.prices||[]).map(Number))}if(d.msg_type==="tick"){let c=d.tick?.symbol,q=+d.tick?.quote;if(c&&Number.isFinite(q)){let a=S.ticks.get(c)||[];a.push(q);S.ticks.set(c,a.slice(-100));evaluate()}}}
function evaluate(){let ar=[];for(let c of S.ok){if(S.blocked.has(c))continue;let z=calc(S.ticks.get(c)||[]);if(z)ar.push({...S.sy.get(c),...z})}ar.sort((a,b)=>b.n-a.n);$("scan").innerHTML=ar.slice(0,12).map(x=>`<tr><td>${x.n}</td><td>${x.sg}</td><td>${x.n}%</td></tr>`).join("");let b=ar[0];if(b){$("market").textContent=b.n;$("sig").textContent=b.sg;$("score").textContent=b.n+"%";if(S.on&&!S.busy&&b.n>=(+$("min").value||72))place(b)}}
function place(c){S.busy=true;let q={proposal:1,amount:S.stake,basis:"stake",contract_type:c.sg==="RISE"?"CALL":"PUT",currency:S.cur,underlying_symbol:c.c,duration:+$("dur").value||15,duration_unit:"s",req_id:++S.t};S.pending={k:"p",c,q};ts(q)}
function trade(e){let d;try{d=JSON.parse(e.data)}catch{return}if(d.msg_type==="balance"){let b=+d.balance?.balance;if(Number.isFinite(b))$("bal").textContent=money(b);return}if(d.error){let p=d.echo_req?.passthrough?.probe;if(p){S.ok.delete(p);return}say(d.error.message);S.busy=false;S.pending=null;return}if(d.msg_type==="proposal"&&d.echo_req?.passthrough?.probe){S.ok.add(d.echo_req.passthrough.probe);return}if(d.msg_type==="proposal"&&S.pending?.k==="p"){S.pending.k="b";ts({buy:d.proposal.id,price:Number((+d.proposal.ask_price*1.02).toFixed(2)),req_id:++S.t})}else if(d.msg_type==="buy"&&S.pending?.k==="b"){let c=S.pending.c;S.active={id:d.buy.contract_id,c:c.c,n:c.n,sg:c.sg,stake:S.stake};S.pending=null;ts({proposal_open_contract:1,contract_id:S.active.id,subscribe:1,req_id:++S.t})}else if(d.msg_type==="proposal_open_contract"&&S.active&&String(d.proposal_open_contract?.contract_id)===String(S.active.id)){let c=d.proposal_open_contract;if(c.is_sold||["won","lost","sold"].includes(String(c.status||"").toLowerCase()))settle(+c.profit||0)}}
function settle(p){let a=S.active,w=p>0;S.pl+=p;if(w){S.w++;S.ls=0;S.ml.set(a.c,0);S.stake=+$("base").value||1;S.blocked.clear()}else{S.l++;S.ls++;let n=(S.ml.get(a.c)||0)+1;S.ml.set(a.c,n);S.stake=Math.min(+$("max").value||400,a.stake*(+$("mult").value||2));let x=$("action").value;if(x==="stop1")S.on=false;if(x==="switch1"||(x==="switch2"&&n>=2))S.blocked.add(a.c)}S.active=null;S.busy=false;refresh();if(S.pl>=+$("tp").value||-S.pl>=+$("sl").value||S.ls>=+$("maxl").value)S.on=false;if(S.on)setTimeout(evaluate,0)}
function refresh(){$("stake").textContent=money(S.stake);$("wl").textContent=S.w+"/"+S.l;$("ls").textContent=S.ls;$("pl").textContent=money(S.pl)}
$("connect").onclick=connect;$("start").onclick=()=>{S.stake=+$("base").value||1;S.on=true;S.blocked.clear();refresh();say("BOT ON")};$("stop").onclick=()=>{S.on=false;say("BOT OFF")};setInterval(()=>{ms({ping:1,req_id:++S.r});ts({ping:1,req_id:++S.t});if(S.active)ts({proposal_open_contract:1,contract_id:S.active.id,req_id:++S.t})},12000);refresh();
</script></body></html>
